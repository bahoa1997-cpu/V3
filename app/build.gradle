plugins { id 'com.android.application' }
android { namespace 'vn.offlinetv.player'; compileSdk 35
 compileOptions {
     sourceCompatibility JavaVersion.VERSION_17
     targetCompatibility JavaVersion.VERSION_17
 }
 defaultConfig { applicationId 'vn.offlinetv.player'; minSdk 23; targetSdk 35; versionCode 2; versionName '2.0' }
}

// Optional persistent key for installable updates from GitHub Actions.
if (System.getenv('SIGNING_STORE_FILE')) {
    android.signingConfigs.debug {
        storeFile file(System.getenv('SIGNING_STORE_FILE'))
        storePassword System.getenv('SIGNING_STORE_PASSWORD')
        keyAlias System.getenv('SIGNING_KEY_ALIAS')
        keyPassword System.getenv('SIGNING_KEY_PASSWORD')
    }
}
